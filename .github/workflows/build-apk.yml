name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/ShootTheScene-build${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ShootTheScene-build${{ github.run_number }}
          path: out/*.apk
          retention-days: 30

      - name: Publish APK to a release (direct download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" "out/ShootTheScene-build${{ github.run_number }}.apk" \
            --title "Shoot the Scene build ${{ github.run_number }}" \
            --notes "Test APK. Commit: ${{ github.sha }}" --latest
